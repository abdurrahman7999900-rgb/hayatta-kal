<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Hayatta Kal</title>
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body{margin:0;overflow:hidden;background:#111;font-family:sans-serif;color:#fff}
canvas{display:block;touch-action:none}
#hud{position:fixed;left:10px;top:8px;font-size:14px;text-shadow:0 0 3px #000;line-height:1.5;pointer-events:none;z-index:4}
#h3{font-size:10px;opacity:.8}
.btn{position:fixed;transform:translate(-50%,-50%);border-radius:50%;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.55);display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:none;text-align:center;line-height:1.1;z-index:5}
.btn.on{background:rgba(255,255,255,.42)}
.btn.act{border-color:#00e676;box-shadow:0 0 8px #00e676}
.btn.sel{border-color:#ffeb3b;box-shadow:0 0 0 3px #ffeb3b}
.edit .btn{outline:2px dashed #ffeb3b}
.knob{position:absolute;left:50%;top:50%;width:40%;height:40%;border-radius:50%;background:rgba(255,255,255,.6);transform:translate(-50%,-50%);pointer-events:none}
#gear{position:fixed;right:8px;top:8px;width:44px;height:44px;font-size:26px;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.45);border-radius:50%;z-index:6}
#editbar{position:fixed;left:50%;top:8px;transform:translateX(-50%);display:none;gap:8px;align-items:center;background:rgba(0,0,0,.75);padding:6px 10px;border-radius:10px;z-index:25;font-size:14px}
#panel{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(420px,92vw);max-height:90vh;overflow:auto;background:rgba(0,0,0,.88);padding:14px;border-radius:12px;display:none;z-index:20}
#panel label{display:block;margin:10px 0;font-size:14px}
#panel input[type=range]{width:100%}
button{font-size:15px;padding:8px 12px;margin:4px 4px 0 0;border-radius:8px;border:0;background:#2e7d32;color:#fff}
#start{position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;z-index:30}
#start input{font-size:16px;padding:8px;width:min(300px,80vw);border-radius:8px;border:0}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud"><div id="h1"></div><div id="h2"></div><div id="h3">Mızrak: 10 odun + 5 taş | Kılıç: 5 odun + 8 metal | D.Balta: 5 metal + 10 demir</div></div>
<div id="gear">⚙️</div>
<div id="editbar"><span id="eName"></span><button id="eMinus">−</button><button id="ePlus">+</button><button id="eReset">Sıfırla</button><button id="eDone">Bitti</button></div>
<div id="panel">
<b>Ayarlar</b>
<label>Nişan hassasiyeti <input type="range" id="sSens" min="1" max="10" step="1"></label>
<label>Hareket hassasiyeti <input type="range" id="sMove" min="0.5" max="2" step="0.1"></label>
<label>Buton boyutu <input type="range" id="sScale" min="0.6" max="1.6" step="0.05"></label>
<label>Buton saydamlığı <input type="range" id="sOp" min="0.2" max="1" step="0.05"></label>
<label><input type="checkbox" id="sAuto"> Nişan çubuğunu çekince otomatik vur</label>
<label><input type="checkbox" id="sFace"> Nişan yokken hareket yönüne bak</label>
<button id="bEdit">Buton düzenini değiştir</button><button id="bClose">Kapat</button>
</div>
<div id="start">
<h2>Hayatta Kal</h2>
<input id="nm" maxlength="12" placeholder="Adın">
<input id="sv" placeholder="Sunucu adresi (örn: oyunun.onrender.com)">
<button id="play">Oyna</button>
<div id="msg"></div>
</div>
<script>
const SERVER='';
const $=id=>document.getElementById(id);
const c=$('c'),g=c.getContext('2d');
function rs(){c.width=innerWidth;c.height=innerHeight}rs();onresize=()=>rs();
const W=3000,BH=[100,250,500,1000];
const WN=['Balta','Mızrak','Kılıç','Demir Balta'],TN=['Odun','Taş','Metal','Demir'];
const RC=['#2e7d32','#9e9e9e','#78909c','#d84315'],BC=['#a1887f','#bdbdbd','#90a4ae','#ff7043'];

const DEF={
 joy:{x:15,y:72,s:140},aim:{x:87,y:68,s:120},fire:{x:70,y:82,s:84},
 build:{x:92,y:36,s:60},repair:{x:82,y:36,s:60},
 t0:{x:36,y:90,s:56},t1:{x:44,y:90,s:56},t2:{x:52,y:90,s:56},t3:{x:60,y:90,s:56},
 w1:{x:73,y:20,s:58},w2:{x:81,y:20,s:58},w3:{x:89,y:20,s:58}
};
const defs=[
 {id:'joy',k:'stick',nm:'Hareket çubuğu'},{id:'aim',k:'stick',nm:'Nişan çubuğu'},
 {id:'fire',k:'hold',ic:'⚔️',lb:'VUR',nm:'Vur'},
 {id:'build',k:'tap',ic:'🧱',lb:'YAP',nm:'Duvar yap'},{id:'repair',k:'tap',ic:'🔧',lb:'ONAR',nm:'Onar'},
 {id:'t0',k:'tap',ic:'🪵',lb:'0',nm:'Odun'},{id:'t1',k:'tap',ic:'🪨',lb:'0',nm:'Taş'},
 {id:'t2',k:'tap',ic:'⛓️',lb:'0',nm:'Metal'},{id:'t3',k:'tap',ic:'🔩',lb:'0',nm:'Demir'},
 {id:'w1',k:'tap',ic:'🔱',lb:'Mızrak',nm:'Mızrak yap'},{id:'w2',k:'tap',ic:'🗡️',lb:'Kılıç',nm:'Kılıç yap'},
 {id:'w3',k:'tap',ic:'🪓',lb:'D.Balta',nm:'Demir balta yap'}
];
const byId={};
let cfg;
function load(){
  let s={};
  try{s=JSON.parse(localStorage.getItem('hk_cfg')||'{}')}catch(e){}
  cfg={sens:6,move:1,scale:1,op:0.75,auto:1,face:1,name:'',server:''};
  for(const k in cfg)if(s[k]!==undefined)cfg[k]=s[k];
  cfg.b={};
  for(const id in DEF)cfg.b[id]=Object.assign({},DEF[id],s.b&&s.b[id]);
}
function save(){try{localStorage.setItem('hk_cfg',JSON.stringify(cfg))}catch(e){}}
load();

function place(d){
  const b=cfg.b[d.id],sz=b.s*cfg.scale,el=d.el;
  el.style.left=b.x+'%';el.style.top=b.y+'%';
  el.style.width=sz+'px';el.style.height=sz+'px';el.style.opacity=cfg.op;
  if(d.i){d.i.style.fontSize=(sz*0.42)+'px';d.l.style.fontSize=Math.max(9,sz*0.18)+'px';}
}

let edit=false,sel='',drag=null,fireHeld=false,tier=0;
let ws=null,S={p:[],wo:[]},R=[],C=[],B=[],phase=0;
let me={id:0,inv:{wood:0,stone:0,metal:0,iron:0},hp:100,w:0};
const send=o=>{if(ws&&ws.readyState===1)ws.send(JSON.stringify(o));};

function tap(id){
  if(id==='build')send({t:'build',tier});
  else if(id==='repair')send({t:'repair'});
  else if(id[0]==='t')tier=+id[1];
  else if(id[0]==='w')send({t:'craft',w:+id[1]});
}
function stick(d,e){
  const r=d.el.getBoundingClientRect(),R2=r.width/2;
  let vx=(e.clientX-(r.left+R2))/R2,vy=(e.clientY-(r.top+r.height/2))/R2;
  const m=Math.hypot(vx,vy);
  if(m>1){vx/=m;vy/=m;}
  d.v.x=vx;d.v.y=vy;d.v.m=Math.min(1,m);d.v.on=true;
  d.knob.style.transform='translate(calc(-50% + '+(vx*R2*0.6)+'px),calc(-50% + '+(vy*R2*0.6)+'px))';
}
function down(d,e){
  e.preventDefault();
  if(d.pid!==null)return;
  try{d.el.setPointerCapture(e.pointerId)}catch(x){}
  d.pid=e.pointerId;
  if(edit){sel=d.id;drag=d;refreshSel();return;}
  d.el.classList.add('on');
  if(d.k==='stick')stick(d,e);
  else if(d.k==='hold')fireHeld=true;
  else tap(d.id);
}
function move(d,e){
  if(d.pid!==e.pointerId)return;
  if(edit){
    if(drag===d){
      const b=cfg.b[d.id];
      b.x=Math.max(3,Math.min(97,e.clientX/innerWidth*100));
      b.y=Math.max(3,Math.min(97,e.clientY/innerHeight*100));
      place(d);
    }
    return;
  }
  if(d.k==='stick')stick(d,e);
}
function up(d,e){
  if(d.pid!==e.pointerId)return;
  d.pid=null;d.el.classList.remove('on');
  if(edit){drag=null;save();return;}
  if(d.k==='stick'){d.v.on=false;d.v.m=0;d.v.x=0;d.v.y=0;d.knob.style.transform='translate(-50%,-50%)';}
  else if(d.k==='hold')fireHeld=false;
}
defs.forEach(d=>{
  const el=document.createElement('div');el.className='btn';
  d.el=el;d.pid=null;byId[d.id]=d;
  if(d.k==='stick'){
    d.v={x:0,y:0,m:0,on:false};
    d.knob=document.createElement('div');d.knob.className='knob';el.appendChild(d.knob);
  }else{
    d.i=document.createElement('span');d.i.textContent=d.ic;
    d.l=document.createElement('span');d.l.textContent=d.lb;
    el.appendChild(d.i);el.appendChild(d.l);
  }
  el.onpointerdown=e=>down(d,e);
  el.onpointermove=e=>move(d,e);
  el.onpointerup=e=>up(d,e);
  el.onpointercancel=e=>up(d,e);
  document.body.appendChild(el);
  place(d);
});

// düzenleme
function refreshSel(){
  defs.forEach(d=>d.el.classList.toggle('sel',edit&&d.id===sel));
  $('eName').textContent=sel?byId[sel].nm:'';
}
function size(n){
  if(!sel)return;
  const b=cfg.b[sel];
  b.s=Math.max(30,Math.min(260,b.s+n));
  place(byId[sel]);save();
}
$('gear').onclick=()=>{$('panel').style.display='block';};
$('bClose').onclick=()=>{$('panel').style.display='none';};
$('bEdit').onclick=()=>{
  $('panel').style.display='none';edit=true;
  document.body.classList.add('edit');$('editbar').style.display='flex';
  sel=sel||'fire';refreshSel();
};
$('eDone').onclick=()=>{
  edit=false;document.body.classList.remove('edit');
  $('editbar').style.display='none';refreshSel();save();
};
$('eMinus').onclick=()=>size(-10);
$('ePlus').onclick=()=>size(10);
$('eReset').onclick=()=>{
  cfg.b={};
  for(const id in DEF)cfg.b[id]=Object.assign({},DEF[id]);
  defs.forEach(place);save();
};
// ayar paneli
$('sSens').value=cfg.sens;$('sMove').value=cfg.move;$('sScale').value=cfg.scale;$('sOp').value=cfg.op;
$('sAuto').checked=!!cfg.auto;$('sFace').checked=!!cfg.face;
$('sSens').oninput=e=>{cfg.sens=+e.target.value;save();};
$('sMove').oninput=e=>{cfg.move=+e.target.value;save();};
$('sScale').oninput=e=>{cfg.scale=+e.target.value;defs.forEach(place);save();};
$('sOp').oninput=e=>{cfg.op=+e.target.value;defs.forEach(place);save();};
$('sAuto').onchange=e=>{cfg.auto=e.target.checked?1:0;save();};
$('sFace').onchange=e=>{cfg.face=e.target.checked?1:0;save();};

// bağlantı
$('nm').value=cfg.name;$('sv').value=cfg.server||SERVER;
function connect(){
  const name=($('nm').value||'Oyuncu').trim().slice(0,12)||'Oyuncu';
  let u=$('sv').value.trim();
  cfg.name=name;cfg.server=u;save();
  if(!u){u=(location.protocol==='https:'?'wss://':'ws://')+location.host;}
  else if(!/^wss?:\/\//.test(u)){
    const lo=/^(localhost|127\.|192\.168\.|10\.)/.test(u);
    u=(lo?'ws://':'wss://')+u;
  }
  $('msg').textContent='Bağlanılıyor...';
  try{ws=new WebSocket(u);}catch(x){$('msg').textContent='Adres geçersiz';return;}
  ws.onopen=()=>{$('start').style.display='none';send({t:'join',name});};
  ws.onclose=()=>{$('start').style.display='flex';$('msg').textContent='Bağlantı kurulamadı veya koptu';};
  ws.onmessage=e=>{
    const d=JSON.parse(e.data);
    S=d;phase=d.ph;me=d.me;
    if(d.st){R=d.st.r;C=d.st.c;B=d.st.b;}
  };
}
$('play').onclick=connect;

// girdi gönderme
let A=0;
setInterval(()=>{
  const j=byId.joy.v,a=byId.aim.v;
  let mx=0,my=0;
  if(j.on&&j.m>0.12){
    const k=Math.min(1,j.m*cfg.move)/j.m;
    mx=j.x*k;my=j.y*k;
  }
  let tA=null;
  if(a.on&&a.m>0.25)tA=Math.atan2(a.y,a.x);
  else if(cfg.face&&Math.hypot(mx,my)>0.2)tA=Math.atan2(my,mx);
  if(tA!==null){
    let df=tA-A;
    while(df>Math.PI)df-=2*Math.PI;
    while(-Math.PI>df)df+=2*Math.PI;
    const st=cfg.sens>=10?4:0.08*cfg.sens;
    A+=Math.max(-st,Math.min(st,df));
  }
  send({t:'in',dx:mx,dy:my,a:A});
  if(fireHeld||(cfg.auto&&a.on&&a.m>0.6))send({t:'hit'});
},50);

// çizim
function draw(){
  requestAnimationFrame(draw);
  const mp=S.p.find(q=>q[0]===me.id),cx=mp?mp[1]:W/2,cy=mp?mp[2]:W/2;
  g.fillStyle='#3a6b35';g.fillRect(0,0,c.width,c.height);
  g.save();g.translate(c.width/2-cx,c.height/2-cy);
  g.strokeStyle='#000';g.lineWidth=6;g.strokeRect(0,0,W,W);
  const x0=cx-c.width/2-60,x1=cx+c.width/2+60,y0=cy-c.height/2-60,y1=cy+c.height/2+60;
  const vis=(x,y)=>x>x0&&x1>x&&y>y0&&y1>y;
  for(const [t,x,y] of R){
    if(!vis(x,y))continue;
    g.fillStyle=RC[t];g.beginPath();g.arc(x,y,t?16:22,0,7);g.fill();
    g.strokeStyle='rgba(0,0,0,.4)';g.lineWidth=2;g.stroke();
  }
  for(const [x,y] of C){
    if(!vis(x,y))continue;
    g.fillStyle='#8d6e63';g.fillRect(x-13,y-13,26,26);
    g.strokeStyle='#4e342e';g.lineWidth=3;g.strokeRect(x-13,y-13,26,26);
  }
  for(const [x,y,t,hp,o] of B){
    if(!vis(x,y))continue;
    g.globalAlpha=.4+.6*hp/BH[t];g.fillStyle=BC[t];g.fillRect(x-20,y-20,40,40);
    g.globalAlpha=1;g.strokeStyle=o===me.id?'#00e676':'#000';g.lineWidth=2;g.strokeRect(x-20,y-20,40,40);
  }
  for(const [id,x,y,hp] of S.wo){
    if(!vis(x,y))continue;
    g.fillStyle='#616161';g.beginPath();g.arc(x,y,13,0,7);g.fill();
    g.fillStyle='#f00';g.fillRect(x-6,y-5,4,4);g.fillRect(x+2,y-5,4,4);
  }
  for(const [id,x,y,hp,name,w,col,a,dead] of S.p){
    if(dead)continue;
    g.fillStyle='hsl('+col+',70%,50%)';g.beginPath();g.arc(x,y,14,0,7);g.fill();
    g.strokeStyle=id===me.id?'#fff':'#000';g.lineWidth=2;g.stroke();
    g.strokeStyle='#ddd';g.lineWidth=4;g.beginPath();g.moveTo(x,y);
    g.lineTo(x+Math.cos(a)*(26+w*4),y+Math.sin(a)*(26+w*4));g.stroke();
    g.fillStyle='#fff';g.textAlign='center';g.font='12px sans-serif';g.fillText(name,x,y-26);
    g.fillStyle='#400';g.fillRect(x-16,y-22,32,4);g.fillStyle='#0f0';g.fillRect(x-16,y-22,32*hp/100,4);
  }
  g.restore();
  const dark=100>phase?0:115>phase?(phase-100)/15:170>phase?1:(180-phase)/10;
  if(dark>0){g.fillStyle='rgba(0,0,25,'+(.72*dark)+')';g.fillRect(0,0,c.width,c.height);}
  const dead=S.p.find(q=>q[0]===me.id&&q[8]);
  if(dead){
    g.fillStyle='rgba(120,0,0,.5)';g.fillRect(0,0,c.width,c.height);
    g.fillStyle='#fff';g.textAlign='center';g.font='28px sans-serif';
    g.fillText('Öldün! Birazdan doğacaksın...',c.width/2,c.height/2);
  }
}
draw();

// HUD ve envanter butonları
setInterval(()=>{
  const i=me.inv;
  $('h1').textContent='❤️ '+me.hp+'   ⚔️ '+WN[me.w]+'   👥 '+S.p.length+'   '+(phase>=110?'🌙 GECE':'☀️ Gündüz');
  $('h2').textContent='Yapı malzemesi: '+TN[tier];
  ['wood','stone','metal','iron'].forEach((k,n)=>{
    const d=byId['t'+n];
    d.l.textContent=i[k];
    d.el.classList.toggle('act',tier===n);
  });
  [1,2,3].forEach(w=>byId['w'+w].el.classList.toggle('act',me.w===w));
},200);
</script></body></html>
